services:
  gateway:
    build:
      context: ..
      dockerfile: src/Gateway/Dockerfile
    container_name: licit-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ReverseProxy__Clusters__auth-cluster__Destinations__auth-service__Address=http://auth-service:8080/
      - ReverseProxy__Clusters__tendering-cluster__Destinations__tendering-service__Address=http://tendering-service:8080/
      - ReverseProxy__Clusters__auction-cluster__Destinations__auction-service__Address=http://auction-service:8080/
      - ReverseProxy__Clusters__bidding-cluster__Destinations__bidding-service__Address=http://bidding-service:8080/
      - ReverseProxy__Clusters__wallet-cluster__Destinations__wallet-service__Address=http://wallet-service:8080/
      - ReverseProxy__Clusters__mail-cluster__Destinations__mail-service__Address=http://mail-service:8080/
      - ReverseProxy__Clusters__notification-cluster__Destinations__notification-service__Address=http://notification-service:8080/
      - ReverseProxy__Clusters__frontend-cluster__Destinations__frontend-dev-server__Address=http://host.docker.internal:5173/
      - RateLimiting__Redis__ConnectionString=${AZURE_REDIS_CONNECTION_STRING}
    ports:
      - "5100:8080"
    depends_on:
      auth-service:
        condition: service_started
      tendering-service:
        condition: service_started
      auction-service:
        condition: service_started
      bidding-service:
        condition: service_started
      wallet-service:
        condition: service_started
      mail-service:
        condition: service_started
      notification-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - licit-network

  auth-service:
    build:
      context: ..
      dockerfile: src/Services/AuthService/Dockerfile
    container_name: licit-auth-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=${AUTH_DB_CONNECTION_STRING}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Licit.AuthService
      - JwtSettings__Audience=Licit.Client
      - Redis__ConnectionString=${AZURE_REDIS_CONNECTION_STRING}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__Username=licit
      - RabbitMq__Password=LicitDev2024!
    ports:
      - "5122:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - licit-network

  tendering-service:
    build:
      context: ..
      dockerfile: src/Services/TenderingService/Dockerfile
    container_name: licit-tendering-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=${TENDERING_DB_CONNECTION_STRING}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Licit.AuthService
      - JwtSettings__Audience=Licit.Client
      - Redis__ConnectionString=${AZURE_REDIS_CONNECTION_STRING}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__Username=licit
      - RabbitMq__Password=LicitDev2024!
    ports:
      - "5132:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - licit-network

  auction-service:
    build:
      context: ..
      dockerfile: src/Services/AuctionService/Dockerfile
    container_name: licit-auction-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=${AUCTION_DB_CONNECTION_STRING}
    ports:
      - "5193:8080"
    networks:
      - licit-network

  bidding-service:
    build:
      context: ..
      dockerfile: src/Services/BiddingService/Dockerfile
    container_name: licit-bidding-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=${BIDDING_DB_CONNECTION_STRING}
      - Redis__ConnectionString=${AZURE_REDIS_CONNECTION_STRING}
      - WalletGrpc__Address=http://wallet-service:5143
      - WalletGrpc__ServiceKey=${WALLET_INTERNAL_GRPC_SERVICE_KEY:-licit-wallet-internal-dev-key}
      - WalletGrpc__DeadlineSeconds=3
    ports:
      - "5106:8080"
    depends_on:
      wallet-service:
        condition: service_started
    networks:
      - licit-network

  wallet-service:
    build:
      context: ..
      dockerfile: src/Services/WalletService/Dockerfile
    container_name: licit-wallet-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=${WALLET_DB_CONNECTION_STRING}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Licit.AuthService
      - JwtSettings__Audience=Licit.Client
      - Redis__ConnectionString=${AZURE_REDIS_CONNECTION_STRING}
      - InternalGrpc__Port=5143
      - InternalGrpc__ServiceKey=${WALLET_INTERNAL_GRPC_SERVICE_KEY:-licit-wallet-internal-dev-key}
    ports:
      - "5142:8080"
      - "5143:5143"
    networks:
      - licit-network

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: licit-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=licit
      - RABBITMQ_DEFAULT_PASS=LicitDev2024!
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - licit-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mail-service:
    build:
      context: ..
      dockerfile: src/Services/MailService/Dockerfile
    container_name: licit-mail-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=${MAIL_DB_CONNECTION_STRING}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Licit.AuthService
      - JwtSettings__Audience=Licit.Client
      - AzureCommunicationEmail__ConnectionString=${AZURE_COMMUNICATION_CONNECTION_STRING}
      - AzureCommunicationEmail__FromEmail=${AZURE_COMMUNICATION_FROM_EMAIL}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__Username=licit
      - RabbitMq__Password=LicitDev2024!
    ports:
      - "5152:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - licit-network

  notification-service:
    build:
      context: ..
      dockerfile: src/Services/NotificationService/Dockerfile
    container_name: licit-notification-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=${NOTIFICATION_DB_CONNECTION_STRING}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=Licit.AuthService
      - JwtSettings__Audience=Licit.Client
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:5173
    ports:
      - "5172:8080"
    networks:
      - licit-network

volumes:
  rabbitmq-data:

networks:
  licit-network:
    driver: bridge
